name: iOS

# Builds and tests the Zest Video iPhone app (ios/).
#   core        pure-logic package on Linux (fast)
#   app         real Xcode build + unit tests on an iPhone simulator
#   screens     pictures of every screen, taken in the simulator (artifact "screens")
#   ui-tests    end-to-end tests: the real app in the simulator against a fake
#               server on the runner (artifacts "ui-tests-a" and "ui-tests-b")
#   testflight  manual only: archive and upload to App Store Connect

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also archive and upload this build to TestFlight"
        type: boolean
        default: false
      build_number:
        description: "TestFlight build number (blank = this run's number, always higher than the last)"
        type: string
        default: ""
      version:
        description: "TestFlight version, e.g. 1.0.1 (blank = the one in ios/Config/App.xcconfig)"
        type: string
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ZestCore (swift test)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test the logic package
        working-directory: ios/ZestCore
        run: swift test

  app:
    name: App build + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = Xcode 16 (oldest toolchain we support).
        # macos-26 = Xcode 26 (what App Store uploads must be built with).
        os: [macos-15, macos-26]
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stand-in app icon if the real one is not committed yet
        run: |
          ICON="ZestVideo/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          if [ ! -f "$ICON" ]; then
            echo "::warning::icon-1024.png is missing; building with a plain purple stand-in. The TestFlight job refuses to run without the real icon."
            python3 - "$ICON" <<'PY'
          import struct, sys, zlib
          size = 1024
          row = b"\x00" + bytes((0x6E, 0x20, 0xB9)) * size
          raw = row * size
          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open(sys.argv[1], "wb").write(png)
          PY
          fi

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      key = (version, "Pro" not in device["name"], device["name"])
                      if best is None or key > best[0]:
                          best = (key, device["udid"], device["name"], runtime)
          if best is None:
              sys.exit("No iPhone simulator is installed on this runner.")
          sys.stderr.write("Using %s (%s)\n" % (best[2], best[3]))
          print(best[1])
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          # -quiet prints only warnings and errors, so a compile error is easy to find.
          xcodebuild build-for-testing \
            -project ZestVideo.xcodeproj \
            -scheme ZestVideo \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee build.log

      - name: Compile errors (summary)
        if: failure()
        run: |
          echo "---- errors ----"
          grep -n "error:" build.log | sort -u | head -200 || true

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project ZestVideo.xcodeproj \
            -scheme ZestVideo \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "Test (Suite|Case)|error:|failed|passed|Executed|\*\*" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" test.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ matrix.os }}
          path: |
            ios/build.log
            ios/test.log
          if-no-files-found: ignore

  screens:
    # Real pictures of the real app. The app has a simulator-only screenshot
    # mode: launched with "-ZestScreen <name>" it opens straight on that screen
    # with made-up data (no sign-in, no network, no camera, no prompts). That
    # mode is compiled out of any build for a real phone.
    name: Screenshots
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stand-in app icon if the real one is not committed yet
        run: |
          ICON="ZestVideo/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          if [ ! -f "$ICON" ]; then
            echo "::warning::icon-1024.png is missing; building with a plain purple stand-in."
            python3 - "$ICON" <<'PY'
          import struct, sys, zlib
          size = 1024
          row = b"\x00" + bytes((0x6E, 0x20, 0xB9)) * size
          raw = row * size
          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open(sys.argv[1], "wb").write(png)
          PY
          fi

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick the largest iPhone simulator
        run: |
          # A Pro Max (6.9 inch) gives the size the App Store listing asks for.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          def size_rank(name):
              if "Pro Max" in name:
                  return 3
              if "Plus" in name or "Air" in name:
                  return 2
              if "Pro" in name:
                  return 1
              return 0
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      key = (version, size_rank(device["name"]), device["name"])
                      if best is None or key > best[0]:
                          best = (key, device["udid"], device["name"], runtime)
          if best is None:
              sys.exit("No iPhone simulator is installed on this runner.")
          sys.stderr.write("Using %s (%s)\n" % (best[2], best[3]))
          print(best[1])
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build the app for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ZestVideo.xcodeproj \
            -scheme ZestVideo \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee screens-build.log

      - name: Boot the simulator and install the app
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/ZestVideo.app"
          ls -d "$APP"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          # A clean status bar: 9:41, full battery, full signal. Nice to have only.
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged \
            --batteryLevel 100 --cellularBars 4 --wifiBars 3 || echo "status bar override not available"
          xcrun simctl ui "$SIM_UDID" appearance light || true
          # The simulator's own first-run "slide to type" sheet would cover the keyboard.
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.preferences \
            DidShowContinuousPathIntroduction -bool true || echo "keyboard tutorial setting not available"
          # The build is unsigned; an ad-hoc signature costs nothing and avoids
          # a simulator that refuses to launch it.
          codesign --force --sign - --timestamp=none "$APP" || echo "ad-hoc signing skipped"
          xcrun simctl install "$SIM_UDID" "$APP"

      - name: Take the pictures
        run: |
          mkdir -p screens tiny
          BUNDLE=com.zestlawnpest.video
          # The app writes a small file once a screen is up and the main thread
          # is free. Waiting for it beats guessing how long a launch takes.
          DATA=$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE" data 2>/dev/null || true)
          MARKER="$DATA/Documents/zest-screen-ready.txt"

          # 0 = the picture is one flat colour (a launch screen, not a real screen).
          is_blank() {
            sips -Z 160 "$1" --out "tiny/check.png" >/dev/null 2>&1 || return 1
            python3 Scripts/is_blank.py "tiny/check.png" >/dev/null 2>&1
          }

          failed=""
          blank=""
          slow=""
          number=0
          for name in login code today today2 confirm far record recording review warning saved stopvideo locked queue update; do
            number=$((number + 1))
            file=$(printf "screens/%02d-%s.png" "$number" "$name")
            ok=1
            [ -n "$DATA" ] && rm -f "$MARKER"
            xcrun simctl launch --terminate-running-process "$SIM_UDID" "$BUNDLE" -ZestScreen "$name" || ok=0

            # Wait (up to 30 s) for the app to say this screen is up.
            ready=0
            if [ "$ok" -eq 1 ] && [ -n "$DATA" ]; then
              for _ in $(seq 1 60); do
                if [ "$(cat "$MARKER" 2>/dev/null)" = "$name" ]; then ready=1; break; fi
                sleep 0.5
              done
            fi
            if [ "$ready" -eq 1 ]; then
              sleep 1
            else
              slow="$slow $name"
              sleep 6
            fi

            if [ "$ok" -eq 1 ]; then
              xcrun simctl io "$SIM_UDID" screenshot "$file" || ok=0
            fi
            # A flat picture means the screen had not been drawn yet: try once more.
            if [ "$ok" -eq 1 ] && is_blank "$file"; then
              echo "blank   $name (retaking in 2 s)"
              sleep 2
              xcrun simctl io "$SIM_UDID" screenshot "$file" || ok=0
              if [ "$ok" -eq 1 ] && is_blank "$file"; then
                blank="$blank $name"
                echo "---- last log lines from the app for $name ----"
                xcrun simctl spawn "$SIM_UDID" log show --last 40s --style compact \
                  --predicate 'process == "ZestVideo"' 2>/dev/null | tail -40 || true
              fi
            fi

            if [ "$ok" -eq 1 ] && [ -s "$file" ]; then
              echo "ok      $name"
            else
              echo "FAILED  $name"
              failed="$failed $name"
            fi
          done
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE" || true
          echo
          ls -l screens
          if [ -n "$slow" ]; then
            echo "::warning::These screens never reported ready (slow, hung or crashed):$slow"
          fi
          if [ -n "$blank" ]; then
            echo "::warning::These pictures are still one flat colour after a retake:$blank"
          fi
          if [ -n "$failed" ]; then
            echo "::warning::These screens could not be captured:$failed"
          fi
          # Any crash of the app during the run shows up here.
          ls -1 ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i zestvideo || echo "no crash reports for ZestVideo"
          # One missing picture is not a failure. No pictures at all is.
          count=$(find screens -name '*.png' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::No screenshots were captured."
            exit 1
          fi

      - name: Contact sheet (every screen in one picture)
        continue-on-error: true
        run: |
          mkdir -p thumbs
          for file in screens/*.png; do
            sips -Z 720 "$file" --out "thumbs/$(basename "$file")" >/dev/null
          done
          # Standard-library Python only: no Pillow needed on the runner.
          python3 Scripts/contact_sheet.py thumbs contact-sheet.png 5
          mv contact-sheet.png screens/00-contact-sheet.png

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ios/screens
          if-no-files-found: warn

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-build-log
          path: ios/screens-build.log
          if-no-files-found: ignore

  ui-tests:
    # End-to-end tests. XCUITest drives the real app in the simulator: real
    # sign-in, real storage, real upload queue. The server is a fake one on
    # this runner (ios/Scripts/fake_server.py) that the tests can tell to
    # misbehave. The app's simulator-only UI-test mode swaps in a stand-in
    # for the camera; none of that mode exists in a build for a real phone.
    # Two jobs side by side keep each one short.
    name: UI tests (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sign-in, route, record
            slug: a
            classes: SignInUITests RouteUITests RecordUITests
          - name: kills, bad network
            slug: b
            classes: KillUITests NetworkUITests
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stand-in app icon if the real one is not committed yet
        run: |
          ICON="ZestVideo/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          if [ ! -f "$ICON" ]; then
            echo "::warning::icon-1024.png is missing; building with a plain purple stand-in."
            python3 - "$ICON" <<'PY'
          import struct, sys, zlib
          size = 1024
          row = b"\x00" + bytes((0x6E, 0x20, 0xB9)) * size
          raw = row * size
          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open(sys.argv[1], "wb").write(png)
          PY
          fi

      - name: Check the fake server against itself
        run: |
          set -o pipefail
          python3 Scripts/fake_server.py --self-test | tail -3

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      key = (version, "Pro" not in device["name"], device["name"])
                      if best is None or key > best[0]:
                          best = (key, device["udid"], device["name"], runtime)
          if best is None:
              sys.exit("No iPhone simulator is installed on this runner.")
          sys.stderr.write("Using %s (%s)\n" % (best[2], best[3]))
          print(best[1])
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          mkdir -p ui-artifacts/failures

      - name: Build the app and the UI tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ZestVideo.xcodeproj \
            -scheme ZestVideoUITests \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee ui-artifacts/ui-build.log

      - name: Compile errors (summary)
        if: failure()
        run: |
          echo "---- errors ----"
          grep -n "error:" ui-artifacts/ui-build.log | sort -u | head -200 || true

      - name: Let this test build talk plain HTTP to this Mac
        run: |
          # The fake server is plain HTTP on localhost. iOS only allows that
          # with one key in the app's Info.plist. It is added HERE, to the
          # copy of the app built for this test run, and nowhere else: the
          # project itself has no such exception in any configuration, so a
          # build for a phone or the App Store cannot have it.
          PLIST="build/DerivedData/Build/Products/Debug-iphonesimulator/ZestVideo.app/Info.plist"
          ls -l "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :NSAppTransportSecurity dict" \
            -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          plutil -lint "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"

      - name: Boot the simulator and set it up
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/ZestVideo.app"
          BUNDLE=com.zestlawnpest.video
          # Typing in the tests needs the on-screen keyboard.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl ui "$SIM_UDID" appearance light || true
          # The simulator's own first-run "slide to type" sheet would cover the keyboard.
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.preferences \
            DidShowContinuousPathIntroduction -bool true || echo "keyboard tutorial setting not available"
          # What can be granted ahead of time is. (The tests also answer any
          # system question that still comes up, such as notifications.)
          xcrun simctl install "$SIM_UDID" "$APP" || echo "::warning::could not install ahead of the tests; xcodebuild installs it anyway"
          xcrun simctl privacy "$SIM_UDID" grant location "$BUNDLE" \
            || echo "::warning::could not grant location ahead of time; the tests answer the question themselves"
          # The phone "stands" on the first stop of the fake route.
          xcrun simctl location "$SIM_UDID" set 38.67800,-121.17600 \
            || echo "::warning::could not set the simulator's location"

      - name: Start the fake server
        run: |
          nohup python3 -u Scripts/fake_server.py --port 8765 > ui-artifacts/server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/__test/ping >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8765/__test/ping
          echo
          head -5 ui-artifacts/server.log

      - name: Run the UI tests
        run: |
          set -o pipefail
          ONLY=""
          for class in ${{ matrix.classes }}; do
            ONLY="$ONLY -only-testing:ZestVideoUITests/$class"
          done
          # Variables that start with TEST_RUNNER_ reach the tests without the
          # prefix: this is where a failing test saves its picture and notes.
          export TEST_RUNNER_ZEST_FAILURE_DIR="$PWD/ui-artifacts/failures"
          xcodebuild test-without-building \
            -project ZestVideo.xcodeproj \
            -scheme ZestVideoUITests \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath ui-artifacts/UITests.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            $ONLY 2>&1 | tee ui-artifacts/ui-test.log \
            | grep -E "^Test Case|^Test Suite '(All|Selected)|######## (FAILED|On screen)|^NOTE |error:|Executed [0-9]+ tests|\*\* TEST" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" ui-artifacts/ui-test.log

      - name: What failed, and what the server saw
        if: failure()
        run: |
          # One block per failed test: its name, the assertion, what was on
          # the screen, and every request the fake server got during it.
          echo "==================== FAILED TESTS ===================="
          grep -E "^Test Case .* failed" ui-artifacts/ui-test.log || echo "(no test reported a failure: see the last lines of the log below)"
          found=0
          for note in ui-artifacts/failures/*.txt; do
            [ -f "$note" ] || continue
            found=1
            echo
            echo "------------------------------------------------------------"
            cat "$note"
            echo
          done
          if [ "$found" -eq 0 ]; then
            # The tests print the same block; take it from the log.
            awk '/^######## FAILED/{show=1} show{print} /^########$/{show=0}' ui-artifacts/ui-test.log || true
          fi
          echo
          echo "==================== ASSERTIONS ===================="
          grep -E "error: -\[|\.swift:[0-9]+: error:" ui-artifacts/ui-test.log | sort -u | head -80 || true
          echo
          echo "==================== LAST LINES OF THE LOG ===================="
          tail -40 ui-artifacts/ui-test.log || true
          echo
          echo "==================== CRASH REPORTS ===================="
          ls -1t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i zestvideo | head -5 || echo "none"
          for report in $(ls -1t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i zestvideo | head -2); do
            cp ~/Library/Logs/DiagnosticReports/"$report" ui-artifacts/ || true
          done

      - name: Result summary and failure pictures
        if: always()
        run: |
          RESULT="ui-artifacts/UITests.xcresult"
          if [ -d "$RESULT" ]; then
            xcrun xcresulttool get test-results summary --path "$RESULT" > ui-artifacts/summary.json 2>/dev/null \
              || echo "no summary (this Xcode's xcresulttool does not have that command)"
            xcrun xcresulttool get test-results tests --path "$RESULT" > ui-artifacts/tests.json 2>/dev/null || true
            # Pictures and notes the failed tests attached (kept only for failures).
            xcrun xcresulttool export attachments --path "$RESULT" --output-path ui-artifacts/attachments 2>/dev/null \
              || echo "no attachments exported"
            python3 - ui-artifacts/summary.json <<'PY' || true
          import json, sys
          try:
              summary = json.load(open(sys.argv[1]))
          except Exception as error:
              sys.exit("no readable summary: %s" % error)
          print("result: %s   passed: %s   failed: %s   skipped: %s" % (
              summary.get("result"), summary.get("passedTests"), summary.get("failedTests"), summary.get("skippedTests")))
          for failure in summary.get("testFailures", []):
              print("FAILED %s: %s" % (failure.get("testName"), failure.get("failureText")))
          PY
            # The whole bundle is big; keep it only when something failed.
            if grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" ui-artifacts/ui-test.log 2>/dev/null; then
              rm -rf "$RESULT"
            else
              ditto -c -k --keepParent "$RESULT" ui-artifacts/UITests.xcresult.zip && rm -rf "$RESULT"
            fi
          fi
          ls -l ui-artifacts ui-artifacts/failures 2>/dev/null || true

      - name: Upload the logs, the summary and the failure pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-${{ matrix.slug }}
          path: ios/ui-artifacts
          if-no-files-found: warn

  testflight:
    # NOT YET RUN: this job cannot be tested until the Apple Developer account
    # exists. Before the first run, add these repository secrets
    # (Settings → Secrets and variables → Actions):
    #   APPLE_TEAM_ID   the 10-character Team ID (developer.apple.com → Membership)
    #   ASC_KEY_ID      App Store Connect API key ID  (Users and Access → Integrations)
    #   ASC_ISSUER_ID   the Issuer ID shown on that same page
    #   ASC_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file
    # The API key needs the Admin role so Xcode can create the signing
    # certificate and profile by itself (cloud signing). The app record
    # "com.zestlawnpest.video" must already exist in App Store Connect.
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: [core, app]
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check everything needed is here
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          if [ ! -f ZestVideo/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png ]; then
            echo "::error::The app icon (icon-1024.png) is not committed."
            missing=1
          fi
          exit $missing

      - name: Toolchain
        run: xcodebuild -version

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Pick the build number
        env:
          BUILD_INPUT: ${{ inputs.build_number }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          # App Store Connect refuses a build number it has already seen for
          # the same version. The run number only ever goes up; a re-run of
          # the same run gets ".2", ".3" so it is still new.
          BUILD="$BUILD_INPUT"
          if [ -z "$BUILD" ]; then
            BUILD="${{ github.run_number }}"
            if [ "${{ github.run_attempt }}" != "1" ]; then
              BUILD="$BUILD.${{ github.run_attempt }}"
            fi
          fi
          case "$BUILD" in
            ""|*[!0-9.]*) echo "::error::Build number must be digits and dots, got '$BUILD'."; exit 1 ;;
          esac
          VERSION_SETTING=""
          if [ -n "$VERSION_INPUT" ]; then
            case "$VERSION_INPUT" in
              *[!0-9.]*) echo "::error::Version must be digits and dots, got '$VERSION_INPUT'."; exit 1 ;;
            esac
            VERSION_SETTING="MARKETING_VERSION=$VERSION_INPUT"
          fi
          echo "Build number: $BUILD   Version: ${VERSION_INPUT:-from App.xcconfig}"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION_SETTING=$VERSION_SETTING" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ZestVideo.xcodeproj \
            -scheme ZestVideo \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ZestVideo.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $VERSION_SETTING \
            -quiet 2>&1 | tee archive.log

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZestVideo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
