name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev,video]"

      - name: Run test suite (no network, no credentials)
        run: pytest -q

  video-postgres:
    name: video server on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev,video]"

      - name: Run the video server tests against the database production uses
        env:
          VIDEO_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/zest_test
        run: pytest -q tests/test_video_app.py tests/test_video_web.py tests/test_video_edges.py

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the deploy image (validates requirements.lock + Dockerfile, same as Railway)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fr-mcp:ci

      - name: Smoke-test the built image starts and serves /healthz
        run: |
          docker run -d --name fr-mcp-ci -p 8080:8080 \
            -e MCP_TRANSPORT=http -e PORT=8080 \
            -e FR_AUTH_KEY=ci -e FR_AUTH_TOKEN=ci -e FR_SUBDOMAIN=ci \
            -e MCP_PATH_SECRET=ci-smoke-test \
            fr-mcp:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              echo "healthz OK"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs fr-mcp-ci
          exit 1

      - name: Smoke-test the same image as the video server (second Railway service, `zest-video`)
        run: |
          docker run -d --name zest-video-ci -p 8081:8080 \
            -e PORT=8080 \
            -e FR_AUTH_KEY=ci -e FR_AUTH_TOKEN=ci -e FR_SUBDOMAIN=ci \
            -e VIDEO_DATABASE_URL=sqlite+aiosqlite:////tmp/zest_video_ci.db \
            fr-mcp:ci zest-video
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081/healthz >/dev/null && curl -sf http://localhost:8081/privacy >/dev/null; then
              echo "healthz + a rendered page OK"
              exit 0
            fi
            sleep 1
          done
          echo "video server never became healthy"
          docker logs zest-video-ci
          exit 1
