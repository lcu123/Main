name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev,video]"

      - name: Run test suite (no network, no credentials)
        run: pytest -q

  video-postgres:
    name: video server on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev,video]"

      - name: Run the video server tests against the database production uses
        env:
          VIDEO_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/zest_test
        run: pytest -q tests/test_video_*.py

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the deploy image (validates requirements.lock + Dockerfile, same as Railway)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fr-mcp:ci

      - name: Smoke-test the built image starts and serves /healthz
        run: |
          docker run -d --name fr-mcp-ci -p 8080:8080 \
            -e MCP_TRANSPORT=http -e PORT=8080 \
            -e FR_AUTH_KEY=ci -e FR_AUTH_TOKEN=ci -e FR_SUBDOMAIN=ci \
            -e MCP_PATH_SECRET=ci-smoke-test \
            fr-mcp:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              echo "healthz OK"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs fr-mcp-ci
          exit 1

      - name: Smoke-test the same image as the video server (second Railway service, `zest-video`)
        run: |
          docker run -d --name zest-video-ci -p 8081:8080 \
            -e PORT=8080 \
            -e FR_AUTH_KEY=ci -e FR_AUTH_TOKEN=ci -e FR_SUBDOMAIN=ci \
            -e VIDEO_DATABASE_URL=sqlite+aiosqlite:////tmp/zest_video_ci.db \
            fr-mcp:ci zest-video
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081/healthz >/dev/null && curl -sf http://localhost:8081/privacy >/dev/null; then
              echo "healthz + a rendered page OK"
              exit 0
            fi
            sleep 1
          done
          echo "video server never became healthy"
          docker logs zest-video-ci
          exit 1

      - name: The video server refuses to start on Railway with no database and no bucket
        run: |
          # One of Railway's own variables, and nothing else. A server that came up like this
          # would keep its records in a file and its videos in memory, and lose both at the
          # next restart. It must exit with an error and say why in plain words.
          set +e
          out=$(timeout 60 docker run --rm --name zest-video-refused \
            -e PORT=8080 \
            -e FR_AUTH_KEY=ci -e FR_AUTH_TOKEN=ci -e FR_SUBDOMAIN=ci \
            -e RAILWAY_ENVIRONMENT_ID=test \
            fr-mcp:ci zest-video 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "the video server started (or was still running after a minute): it must refuse"
            docker rm -f zest-video-refused >/dev/null 2>&1 || true
            exit 1
          fi
          if ! echo "$out" | grep -q "NOT starting"; then
            echo "it stopped with exit code $code, but did not say 'NOT starting'"
            exit 1
          fi
          echo "refused to start, exit code $code"
