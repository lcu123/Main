[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fr-mcp"
version = "0.1.0"
description = "Remote MCP server giving Claude read and write access to a FieldRoutes office"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
fr-mcp = "fr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/fr_mcp/fieldroutes_spec.json" = "fr_mcp/fieldroutes_spec.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
