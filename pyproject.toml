[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fr-mcp"
version = "0.1.0"
description = "Zest Lawn & Pest: FieldRoutes MCP server, plus the Visit Video server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The Zest Visit Video server (src/zest_video). Same image, second Railway service.
video = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "h2>=4.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
fr-mcp = "fr_mcp.server:main"
zest-video = "zest_video.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_mcp", "src/zest_video"]

[tool.hatch.build.targets.wheel.force-include]
"src/fr_mcp/fieldroutes_spec.json" = "fr_mcp/fieldroutes_spec.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
