services:
  - type: web
    name: quo-voip-mcp
    runtime: docker
    rootDir: quo_voip_connector
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: QUO_API_KEY
        sync: false          # set manually in Render dashboard
      - key: QUO_SERVER_TOKEN
        sync: false          # set manually in Render dashboard
      - key: QUO_BASE_URL
        value: https://api.quo.voip/v1
      - key: PYTHONUNBUFFERED
        value: "1"

    healthCheckPath: /health
