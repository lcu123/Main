[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quo-voip-connector"
version = "1.0.0"
description = "QUO VOIP connector for Claude – pull call transcription data via API, MCP, CLI, and webhooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["voip", "transcription", "claude", "mcp", "ai"]

dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
claude = [
    "anthropic>=0.40.0",
]
mcp = [
    "mcp>=1.0.0",
]
server = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "mcp>=1.0.0",
]
all = [
    "anthropic>=0.40.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "ruff>=0.4.0",
]

[project.scripts]
quo-voip = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quo_voip*", "mcp*", "cli*", "webhooks*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
